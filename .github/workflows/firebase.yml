name: Firebase multiplayer checks
on:
  push:
    branches: [main]
    paths:
      - 'online/**'
      - 'firebase/**'
      - 'room-rules.js'
      - 'game-engine.js'
      - 'client.js'
      - 'index.html'
      - 'music.js'
      - 'tv.js'
      - 'scripts/*layout.cjs'
      - 'firebase.emulator.json'
      - 'package.json'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: online/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix online ci
      - run: npm --prefix online exec -- playwright install --with-deps chromium
      - run: npm run test:firebase
