name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node --check server.js && node --check client.js && node --check fun-client.js && node --check game-engine.js && node --check tv.js && node --check join-code.js && node --check server-policy.js && node --check room-rules.js
